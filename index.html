<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Geez 3D Table</title>

<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #050508; color: #d6c9ae; font: 14px/1.4 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif; }
  canvas { display: block; touch-action: none; }
  .panel { position: fixed; background: linear-gradient(#17120fee, #0b090aee); border: 1px solid #5c4a2e; border-radius: 3px; padding: 10px; box-shadow: 0 0 0 1px #000, 0 8px 24px #000a; }
  #vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 46%, transparent 55%, #02020455 80%, #010102bb 100%); }
  #ui { top: 10px; left: 10px; width: 210px; display: grid; gap: 8px; }
  #ui summary { cursor: pointer; font-weight: 700; color: #c9a45c; letter-spacing: .12em; text-transform: uppercase; }
  #ui details[open] summary { margin-bottom: 8px; }
  #ui .body { display: grid; gap: 8px; }
  label { display: grid; gap: 2px; }
  label.check { display: flex; align-items: center; gap: 6px; }
  button, select { font: inherit; color: inherit; background: #1d1815; border: 1px solid #4d3f2b; border-radius: 2px; padding: 6px 8px; cursor: pointer; }
  button:hover, select:hover { background: #2c231c; border-color: #8a6d3c; }
  button.primary { background: #4c1313; border-color: #8e6a35; color: #efdfba; font-weight: 700; letter-spacing: .05em; }
  button.primary:hover { background: #6a1a18; }
  input[type=range] { width: 100%; accent-color: #9c6b2a; }
  #stats { bottom: 10px; left: 10px; padding: 5px 9px; color: #8f826c; font-size: 11px; max-width: calc(100% - 20px); }
  #empty { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 12px; text-align: center; padding: 20px; pointer-events: none; }
  #empty button { pointer-events: auto; font-size: 15px; padding: 10px 18px; }
  #empty h1 { margin: 0; font-size: 30px; color: #c9a45c; letter-spacing: .18em; text-transform: uppercase; text-shadow: 0 0 18px #7a1c12; }
  body.drag::after { content: "Drop to load map"; position: fixed; inset: 12px; border: 2px solid #8e6a35; border-radius: 4px; display: grid; place-content: center; font-size: 24px; background: #000a; pointer-events: none; }
  [hidden] { display: none !important; }
</style>

<body>
<div id="vignette"></div>
<div id="empty"><h1>Geez 3D Table</h1><div id="msg" role="status">Drop a <b>.dd2vtt</b> map anywhere</div><button class="primary" data-open>Open map</button></div>

<div id="ui" class="panel">
  <details id="menu" open><summary>Map</summary>
    <div class="body">
      <button class="primary" data-open>Open .dd2vtt</button>
      <input id="file" type="file" accept=".dd2vtt,.uvtt,.df2vtt,.json" hidden>
      <label>Quality<select id="quality"><option value="auto">Auto</option><option value="low">Low (potato)</option><option value="medium">Medium</option><option value="high">High</option></select></label>
      <label>Night to day<input id="time" type="range" min="0" max="1" step="0.01" value="0.3"></label>
      <label>Wall height<input id="height" type="range" min="0.25" max="2.4" step="0.05" value="1.1"></label>
      <label class="check"><input id="fixtures" type="checkbox" checked> Torches and braziers</label>
      <label class="check"><input id="grid" type="checkbox" checked> Grid</label>
      <button id="top">Top-down view</button>
      <small>Drag: pan · Right-drag: rotate · Scroll: zoom<br>Click a door to open it. Shift-click swaps door and window.</small>
    </div>
  </details>
</div>
<div id="stats" class="panel" hidden></div>

<script>
  // Module scripts fail silently when the CDN is unreachable, so say so.
  setTimeout(() => { if (!window.tableReady) document.getElementById('msg').textContent = 'Could not load the 3D library. Check your internet connection and reload.'; }, 12000);
</script>
<script type="module">
import * as THREE from 'three';
import { MapControls } from 'three/addons/controls/MapControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const $ = (s) => document.querySelector(s);
const params = new URLSearchParams(location.search);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const store = { get: (k) => { try { return localStorage.getItem('geez3d.' + k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem('geez3d.' + k, v); } catch { /* private mode */ } } };

/* ---------------- dd2vtt ---------------- */
// Everything is in grid cells: x to the right, z down the map. A segment is [x1, z1, x2, z2].
function parseMap(j) {
  const res = j?.resolution, w = Number(res?.map_size?.x), h = Number(res?.map_size?.y);
  if (!(w > 0 && h > 0 && w <= 512 && h <= 512)) throw Error('Not a dd2vtt map (bad or missing resolution.map_size).');
  const ox = Number(res.map_origin?.x) || 0, oz = Number(res.map_origin?.y) || 0;
  const pt = (p) => Number.isFinite(p?.x) && Number.isFinite(p?.y) ? [p.x - ox, p.y - oz] : null;
  const segments = (lines) => (Array.isArray(lines) ? lines : []).flatMap((line) => (Array.isArray(line) ? line : []).slice(1).map((p, i) => {
    const a = pt(line[i]), b = pt(p);
    return a && b && Math.hypot(b[0] - a[0], b[1] - a[1]) > 0.01 ? [...a, ...b] : null;
  }).filter(Boolean));
  // Dungeondraft and Dungeon Alchemist export windows as open portals and doors as closed ones.
  const doors = (Array.isArray(j.portals) ? j.portals : []).map((p) => {
    const a = pt(p?.bounds?.[0]), b = pt(p?.bounds?.[1]);
    return a && b && Math.hypot(b[0] - a[0], b[1] - a[1]) > 0.05 ? { seg: [...a, ...b], window: p.closed === false, open: false, swing: 0 } : null;
  }).filter(Boolean);
  const lights = (Array.isArray(j.lights) ? j.lights : []).map((l) => {
    const p = pt(l?.position), range = Number(l?.range);
    if (!p || !(range > 0)) return null;
    const hex = String(l.color || '').replace('#', ''), rgb = /^[0-9a-f]{8}$/i.test(hex) ? hex.slice(2) : /^[0-9a-f]{6}$/i.test(hex) ? hex : 'ffd9a0'; // dd2vtt colours are AARRGGBB
    return { x: p[0], z: p[1], range: Math.min(range, 40), power: clamp(0.4 + (Number(l.intensity) || 1) * 0.2, 0.4, 1.2), color: '#' + rgb, shadows: l.shadows !== false, poly: null };
  }).filter(Boolean);
  return { w, h, walls: segments(j.line_of_sight), blockers: segments(j.objects_line_of_sight), doors, lights };
}

/* ---------------- 2D geometry ---------------- */
function rayHit(x, z, dx, dz, s) {
  const ex = s[2] - s[0], ez = s[3] - s[1], den = dx * ez - dz * ex;
  if (Math.abs(den) < 1e-9) return Infinity;
  const px = s[0] - x, pz = s[1] - z, t = (px * ez - pz * ex) / den, u = (px * dz - pz * dx) / den;
  return t > 0 && u >= -1e-6 && u <= 1 + 1e-6 ? t : Infinity;
}
function visibility(x, z, r, segs, rays = 240) {
  const near = segs.filter((s) => Math.min(s[0], s[2]) <= x + r && Math.max(s[0], s[2]) >= x - r && Math.min(s[1], s[3]) <= z + r && Math.max(s[1], s[3]) >= z - r);
  return Array.from({ length: rays }, (_, i) => {
    const a = i / rays * Math.PI * 2, dx = Math.cos(a), dz = Math.sin(a);
    let t = r;
    for (const s of near) { const hit = rayHit(x, z, dx, dz, s); if (hit > 0.08 && hit < t) t = hit; } // 0.08: lights sitting on a wall still shine
    return [x + dx * t, z + dz * t];

}
function closest(x, z, s) {
  const ex = s[2] - s[0], ez = s[3] - s[1], u = clamp(((x - s[0]) * ex + (z - s[1]) * ez) / (ex * ex + ez * ez), 0, 1);
  const cx = s[0] + ex * u, cz = s[1] + ez * u;
  return { x: cx, z: cz, d: Math.hypot(x - cx, z - cz), ex, ez };
}

/* ---------------- quality ---------------- */
const PRESETS = {
  low:    { scale: 0.75, maxPr: 1,    aa: false, shadow: 0,    tex: 2048, light: 1024, ppc: 12, blocks: false, glow: false, flicker: false },
  medium: { scale: 1,    maxPr: 1.25, aa: true,  shadow: 1024, tex: 4096, light: 2048, ppc: 20, blocks: true,  glow: true,  flicker: true },
  high:   { scale: 1,    maxPr: 2,    aa: true,  shadow: 2048, tex: 8192, light: 4096, ppc: 32, blocks: true,  glow: true,  flicker: true }
};
function guessQuality() {
  const gl = document.createElement('canvas').getContext('webgl2');
  const info = gl?.getExtension('WEBGL_debug_renderer_info'), gpu = info ? gl.getParameter(info.UNMASKED_RENDERER_WEBGL) : '';

}
let choice = params.get('q') || store.get('quality') || 'auto';
if (choice !== 'auto' && !PRESETS[choice]) choice = 'auto';
let level = choice === 'auto' ? guessQuality() : choice, Q = PRESETS[level];

/* ---------------- shared shader pieces ---------------- */
// All map lights are painted into one 2D texture; surfaces look it up by world position.
// The cost per frame is the same for 1 light or 500, which is what keeps weak GPUs smooth.
const U = { uLM: { value: null }, uSize: { value: new THREE.Vector2(1, 1) }, uGain: { value: 1 }, uSat: { value: 1 }, uTime: { value: 0 }, uPx: { value: 1 } };
function lit(material) {
  material.onBeforeCompile = (s) => {
    Object.assign(s.uniforms, { uLM: U.uLM, uSize: U.uSize, uGain: U.uGain, uSat: U.uSat });
    s.vertexShader = 'varying vec3 vWp;\n' + s.vertexShader.replace('#include <fog_vertex>', `#include <fog_vertex>
      vec4 wp4 = vec4(transformed, 1.0);
      #ifdef USE_INSTANCING
        wp4 = instanceMatrix * wp4;
      #endif
      vWp = (modelMatrix * wp4).xyz;`);
    // Sample a little way out along the face, so a wall takes the light from the side you are looking at.
    s.fragmentShader = 'uniform sampler2D uLM; uniform vec2 uSize; uniform float uGain, uSat; varying vec3 vWp;\n' + s.fragmentShader.replace('#include <opaque_fragment>', `
      vec3 fn = normalize(cross(dFdx(vWp), dFdy(vWp)));
      vec3 glow = texture2D(uLM, (vWp.xz + fn.xz * 0.25) / uSize).rgb * uGain * mix(0.55, 1.0, abs(fn.y));
      outgoingLight = mix(vec3(dot(outgoingLight, vec3(0.3, 0.59, 0.11))), outgoingLight, uSat); // moonlight drains colour
      outgoingLight += diffuseColor.rgb * glow / (1.0 + glow * 0.5); // soft shoulder: crowded torches don't burn to white
      float edge = min(min(vWp.x, uSize.x - vWp.x), min(vWp.z, uSize.y - vWp.z));
      outgoingLight *= 0.5 + 0.5 * smoothstep(0.0, 3.0, edge);

}

    s.vertexShader = 'uniform float uTime;\n' + s.vertexShader.replace('#include <begin_vertex>', `#include <begin_vertex>
      transformed.xz *= 1.0 + 0.18 * sin(uTime * 11.0 + instanceMatrix[3][0] * 7.0);
      transformed.y *= 1.0 + 0.25 * sin(uTime * 7.0 + instanceMatrix[3][2] * 5.0);`);
  };
  material.customProgramCacheKey = () => 'geez-flame';
  return material;
}

const emberMaterial = () => new THREE.ShaderMaterial({
  uniforms: { uTime: U.uTime, uPx: U.uPx }, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `attribute float seed; uniform float uTime, uPx; varying float vLife;
    void main() {
      float t = fract(uTime * (0.35 + fract(seed * 7.3) * 0.3) + seed);
      vec3 p = position + vec3(sin(seed * 40.0 + uTime * 2.0) * 0.18 * t, t * 0.9, cos(seed * 23.0 + uTime * 1.7) * 0.18 * t);
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_Position = projectionMatrix * mv; gl_PointSize = clamp(uPx * 0.045 / -mv.z, 1.0, 5.0); vLife = 1.0 - t;
    }`,
  fragmentShader: `varying float vLife; void main() { gl_FragColor = vec4(1.0, 0.25 + 0.45 * vLife, 0.05, vLife); }`
});

/* ---------------- renderer and camera ---------------- */
const scene = new THREE.Scene();
scene.background = new THREE.Color();
scene.fog = new THREE.Fog(0x000000, 40, 120);
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.2, 1500);
const hemi = new THREE.HemisphereLight(), sun = new THREE.DirectionalLight();
scene.add(hemi, sun, sun.target);
let renderer, controls, dirty = true, world = new THREE.Group(), map = null, picture = null;
scene.add(world);

function makeRenderer() {
  const target = controls?.target.clone();
  if (renderer) { renderer.setAnimationLoop(null); controls.dispose(); renderer.dispose(); renderer.forceContextLoss(); renderer.domElement.remove(); sun.shadow.map?.dispose(); sun.shadow.map = null; }
  renderer = new THREE.WebGLRenderer({ antialias: Q.aa, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(devicePixelRatio, Q.maxPr) * Q.scale);
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = Q.shadow > 0;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.shadowMap.autoUpdate = false; // the sun and walls are still: redraw shadows only when something changes
  document.body.prepend(renderer.domElement);
  controls = new MapControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.dampingFactor = 0.15; controls.zoomToCursor = true;
  controls.maxPolarAngle = 1.3; controls.minDistance = 3;
  if (target) controls.target.copy(target);
  controls.addEventListener('change', () => { dirty = true; });
  picking(renderer.domElement);
  renderer.setAnimationLoop(tick);
}

const TIMES = [ // moonlit night, blood dusk, overcast day
  { sky: 0x6a8cc0, ground: 0x2c2230, hemi: 1.65, sun: 0x86a6ee, sunI: 1.5, gain: 4.0, sat: 0.5, bg: 0x04060a },
  { sky: 0xa092ac, ground: 0x422a22, hemi: 1.75, sun: 0xdc7442, sunI: 2.0, gain: 3.0, sat: 0.68, bg: 0x0d080c },
  { sky: 0xc4d0dc, ground: 0x6a5f54, hemi: 1.9, sun: 0xeadcc4, sunI: 2.1, gain: 1.1, sat: 0.75, bg: 0x181d24 }
];
function applyTime() {
  const t = Number($('#time').value) * 2, i = Math.min(1, Math.floor(t)), f = t - i, a = TIMES[i], b = TIMES[i + 1];
  const num = (k) => a[k] + (b[k] - a[k]) * f, col = (target, k) => target.setHex(a[k]).lerp(new THREE.Color(b[k]), f);
  col(hemi.color, 'sky'); col(hemi.groundColor, 'ground'); col(sun.color, 'sun'); col(scene.background, 'bg');
  hemi.intensity = num('hemi'); sun.intensity = num('sunI'); U.uGain.value = num('gain'); U.uSat.value = num('sat');
  scene.fog.color.copy(scene.background);
  dirty = true;
}

/* ---------------- building the world ---------------- */
// Warm and white lights burn like fire; blue and green ones are magic and keep their colour.
function fire(hex) {
  const c = new THREE.Color(hex);
  if (c.r >= c.b && c.r >= c.g * 0.92) c.lerp(c.clone().multiply(new THREE.Color(0xff9a4a)), 0.8);
  return c;
}
const random = (seed) => () => { seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
const THICK = 0.22, Y = new THREE.Vector3(0, 1, 0), dummy = new THREE.Object3D();
const matrix = (x, y, z, ry, sx, sy, sz) => { dummy.position.set(x, y, z); dummy.rotation.set(0, ry, 0); dummy.scale.set(sx, sy, sz); dummy.updateMatrix(); return dummy.matrix.clone(); };
const heading = (dx, dz) => Math.atan2(-dz, dx); // rotation about Y that points local +x along (dx, dz)

function instances(geo, material, list, { shadows = true } = {}) {
  if (!list.length) { geo.dispose(); material.dispose(); return null; }
  const mesh = new THREE.InstancedMesh(geo, material, list.length);
  list.forEach((it, i) => { mesh.setMatrixAt(i, it.m); if (it.c) mesh.setColorAt(i, it.c); });
  mesh.castShadow = mesh.receiveShadow = shadows;

  return mesh;
}
function chunk(jitter) { // a unit cube with its corners knocked about: the one stone every wall is made of
  const g = new THREE.BoxGeometry(1, 1, 1).toNonIndexed(), p = g.attributes.position;
  const h = (x, y, z, k) => { const n = Math.sin(x * 127.1 + y * 311.7 + z * 74.7 + k * 19.3) * 43758.5453; return (n - Math.floor(n) - 0.5) * 2 * jitter; };
  for (let i = 0; i < p.count; i++) { const x = p.getX(i), y = p.getY(i), z = p.getZ(i); p.setXYZ(i, x + h(x, y, z, 1), y + h(x, y, z, 2), z + h(x, y, z, 3)); }

}

  for (let i = 0; i < data.length; i += 3) c.toArray(data, i);
  return geo.setAttribute('color', new THREE.BufferAttribute(data, 3));
}
const merged = (parts) => { const g = mergeGeometries(parts); parts.forEach((p) => p.dispose()); return g; };
const part = (geo, hex, x, y, z, rx = 0) => painted(geo.rotateX(rx).translate(x, y, z), hex);

let sampler = null; // small copy of the map picture, used to tint stone to match the art
function stone(x, z, rnd) {
  const base = new THREE.Color(0x5d6268);
  if (sampler) {
    const px = clamp(Math.round(x / map.w * sampler.width), 1, sampler.width - 2), pz = clamp(Math.round(z / map.h * sampler.height), 1, sampler.height - 2);

    for (let i = -1; i <= 1; i++) for (let k = -1; k <= 1; k++) { const o = ((pz + k) * sampler.width + px + i) * 4; r += sampler.data[o]; g += sampler.data[o + 1]; b += sampler.data[o + 2]; }

function buildWalls(H) {

    const put = (t, y, sx, sy, sz, c, wobble = 0) => blocks.push({ m: matrix(x1 + dx * t, y, z1 + dz * t, ry + wobble, sx, sy, sz), c });

    if (Q.blocks) {

      const rows = Math.max(1, Math.round(H / 0.36)), rh = H / rows;
      for (let r = 0; r < rows; r++) {
        const cuts = [0, ...Array.from({ length: n - 1 }, (_, i) => (i + (r % 2 ? 0.5 : 1)) / n), ...(r % 2 && n > 1 ? [(n - 0.5) / n] : []), 1];
        for (let i = 1; i < cuts.length; i++) {

      }

        blocks.push({ m: matrix(x1 + dx * t - dz / len * off, size * 0.3, z1 + dz * t + dx / len * off, rnd() * 6, size * 1.3, size * 0.7, size), c: stone(x1 + dx * t, z1 + dz * t, rnd) });
      }

    }

  const joints = new Map(), key = (x, z) => `${Math.round(x * 20)},${Math.round(z * 20)}`;
  for (const [x1, z1, x2, z2] of map.walls) for (const [x, z, ox, oz] of [[x1, z1, x2, z2], [x2, z2, x1, z1]]) {
    const k = key(x, z), len = Math.hypot(ox - x, oz - z);
    if (!joints.has(k)) joints.set(k, { x, z, dirs: [] });
    joints.get(k).dirs.push([(ox - x) / len, (oz - z) / len]);
  }
  const post = (x, z, r, h) => {

let doorMesh = null, hitMesh = null, leaves = [];
function doorMatrix(d, H) {

}
function buildDoors(H) {

    hits.push({ m: matrix(x, H / 2, z, ry, len, H, 0.5) });

function glowSprite() {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'), r = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  r.addColorStop(0, 'rgba(255,255,255,0.9)'); r.addColorStop(0.3, 'rgba(255,255,255,0.3)'); r.addColorStop(1, 'rgba(255,255,255,0)');

}
function buildFixtures(H) {
  if (!$('#fixtures').checked) return;
  const sconces = [], braziers = [], flames = [], glowPos = [], glowCol = [];
  for (const l of map.lights) {
    let best = null;
    for (const s of map.walls) { const c = closest(l.x, l.z, s); if (!best || c.d < best.d) best = c; }
    const color = fire(l.color);
    let fx = l.x, fy = 0.66, fz = l.z;
    if (best && best.d < 0.5) { // mount a torch on the wall, leaning toward the lit side
      const nx = best.d > 0.02 ? (l.x - best.x) / best.d : -best.ez / Math.hypot(best.ex, best.ez), nz = best.d > 0.02 ? (l.z - best.z) / best.d : best.ex / Math.hypot(best.ex, best.ez);
      const y = Math.max(0.15, H * 0.62), x = best.x + nx * THICK / 2, z = best.z + nz * THICK / 2;
      sconces.push({ m: matrix(x, y, z, Math.atan2(nx, nz), 1, 1, 1) });
      fx = x + nx * 0.2; fz = z + nz * 0.2; fy = y + 0.3;
    } else braziers.push({ m: matrix(l.x, 0, l.z, l.x * 3, 1, 1, 1) });
    flames.push({ m: matrix(fx, fy, fz, 0, 1, 1, 1), c: color.clone().lerp(new THREE.Color(0xffe0a0), 0.2) });
    glowPos.push(fx, fy, fz); glowCol.push(color.r, color.g, color.b);

  const iron = 0x1c1d23, wood = 0x3a2616;
  const wall = () => lit(new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: true }));
  instances(merged([
    part(new THREE.BoxGeometry(0.16, 0.2, 0.04), iron, 0, 0, 0.02),
    part(new THREE.BoxGeometry(0.05, 0.05, 0.18), iron, 0, 0, 0.11),
    part(new THREE.CylinderGeometry(0.045, 0.025, 0.3, 5), wood, 0, 0.07, 0.19, 0.12),
    part(new THREE.CylinderGeometry(0.075, 0.055, 0.07, 6), iron, 0, 0.21, 0.2)
  ]), wall(), sconces);
  instances(merged([
    part(new THREE.CylinderGeometry(0.22, 0.12, 0.15, 7), iron, 0, 0.45, 0),
    part(new THREE.CylinderGeometry(0.17, 0.17, 0.04, 7), 0xc2521f, 0, 0.52, 0),
    ...[0, 1.26, 2.51, 3.77, 5.03].map((a) => part(new THREE.ConeGeometry(0.025, 0.14, 4), iron, Math.cos(a) * 0.2, 0.57, Math.sin(a) * 0.2)),
    ...[0, 2.1, 4.2].map((a) => part(new THREE.BoxGeometry(0.04, 0.46, 0.04).rotateZ(0.28).rotateY(a), iron, Math.cos(a) * 0.14, 0.21, -Math.sin(a) * 0.14))
  ]), wall(), braziers);

  if (Q.glow && glowPos.length) {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(glowPos, 3));
    g.setAttribute('color', new THREE.Float32BufferAttribute(glowCol, 3));
    world.add(new THREE.Points(g, new THREE.PointsMaterial({ map: glowSprite(), size: 1.5, vertexColors: true, transparent: true, opacity: 0.5, fog: false, blending: THREE.AdditiveBlending, depthWrite: false })));
  }
  if (Q.flicker && glowPos.length) {
    const rnd = random(3), from = [], seed = [];
    for (let i = 0; i < glowPos.length; i += 3) for (let k = 0; k < 5; k++) { from.push(glowPos[i], glowPos[i + 1], glowPos[i + 2]); seed.push(rnd()); }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(from, 3));
    g.setAttribute('seed', new THREE.Float32BufferAttribute(seed, 1));

}

function picture2d(max) {
  const scale = Math.min(1, max / Math.max(picture.width, picture.height));
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(picture.width * scale)); c.height = Math.max(1, Math.round(picture.height * scale));
  const g = c.getContext('2d', max <= 512 ? { willReadFrequently: true } : undefined);
  g.drawImage(picture, 0, 0, c.width, c.height);
  return { canvas: c, g };
}
function buildFloor() {
  const { w, h } = map, material = lit(new THREE.MeshLambertMaterial({ color: picture ? 0xffffff : 0x6f675c }));
  sampler = null;
  if (picture) {
    const tex = new THREE.CanvasTexture(picture2d(Math.min(Q.tex, renderer.capabilities.maxTextureSize)).canvas);
    tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
    material.map = tex;
    const small = picture2d(512);
    sampler = small.g.getImageData(0, 0, small.canvas.width, small.canvas.height);
  }
  if (picture) material.color.setHex(0xe8e2d8); // take the shine off bright map art
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(w, h).rotateX(-Math.PI / 2), material);
  floor.position.set(w / 2, 0, h / 2); floor.receiveShadow = true;
  const slab = new THREE.Mesh(new THREE.BoxGeometry(w + 0.4, 0.9, h + 0.4), new THREE.MeshLambertMaterial({ color: 0x17121a, flatShading: true }));
  slab.position.set(w / 2, -0.47, h / 2);
  const lines = [];
  for (let x = 0; x <= w; x++) lines.push(x, 0, 0, x, 0, h);
  for (let z = 0; z <= h; z++) lines.push(0, 0, z, w, 0, z);
  const grid = new THREE.LineSegments(new THREE.BufferGeometry().setAttribute('position', new THREE.Float32BufferAttribute(lines, 3)), new THREE.LineBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.28 }));
  grid.position.y = 0.012; grid.name = 'grid'; grid.visible = $('#grid').checked;
  world.add(floor, slab, grid);
}

const lightCanvas = document.createElement('canvas');
const blocking = () => map.walls.concat(map.blockers, map.doors.filter((d) => !d.window && !d.open).map((d) => d.seg));

  const cw = Math.max(1, Math.round(map.w * ppc)), ch = Math.max(1, Math.round(map.h * ppc));
  if (lightCanvas.width !== cw || lightCanvas.height !== ch || !U.uLM.value) {
    lightCanvas.width = cw; lightCanvas.height = ch;
    U.uLM.value?.dispose();
    U.uLM.value = new THREE.CanvasTexture(lightCanvas);
    Object.assign(U.uLM.value, { flipY: false, colorSpace: THREE.SRGBColorSpace, generateMipmaps: false, minFilter: THREE.LinearFilter });
  }

  g.setTransform(1, 0, 0, 1, 0, 0); g.globalCompositeOperation = 'source-over'; g.fillStyle = '#000'; g.fillRect(0, 0, cw, ch);

let builtAt = 0;
function build() {

function frame(topDown = false) {
  const aspect = Math.max(0.4, camera.aspect), dist = Math.max(map.h, map.w / aspect) * (topDown ? 1.45 : 1.3) + 3, tilt = topDown ? 0.001 : 0.75;

/* ---------------- doors ---------------- */
function useDoor(i, swap) {
  const d = map.doors[i];
  if (swap) { d.window = !d.window; d.open = false; d.swing = 0; }
  else if (d.window) return;
  else d.open = !d.open;
  const [x1, z1, x2, z2] = d.seg, x = (x1 + x2) / 2, z = (z1 + z2) / 2;
  for (const l of map.lights) if (Math.hypot(l.x - x, l.z - z) < l.range * 1.25 + 2) l.poly = null; // only nearby lights change
  if (swap) build(); else { bakeLights(); dirty = true; }
}
function doorAt(e) {

  ray.setFromCamera(new THREE.Vector2(e.clientX / innerWidth * 2 - 1, 1 - e.clientY / innerHeight * 2), camera);
  return ray.intersectObject(hitMesh)[0]?.instanceId ?? -1;
}
function picking(canvas) {
  let down = null;
  canvas.addEventListener('pointerdown', (e) => { down = e.button === 0 && e.isPrimary ? { x: e.clientX, y: e.clientY } : null; });
  canvas.addEventListener('pointerup', (e) => {
    if (!down || Math.hypot(e.clientX - down.x, e.clientY - down.y) > 6) return;
    const i = doorAt(e); if (i >= 0) useDoor(i, e.shiftKey);

/* ---------------- loop: draw only when something moved ---------------- */
let last = 0, drawn = 0, slow = 0, statsAt = -Infinity;
function tick(now) {
  const gap = now - last, dt = Math.min(0.05, gap / 1000); last = now;
  controls.update();
  let moving = false;
  leaves.forEach((d, i) => {
    const to = d.open ? 1 : 0;
    if (d.swing === to) return;
    d.swing = Math.abs(to - d.swing) < 0.01 ? to : d.swing + (to - d.swing) * Math.min(1, dt * 9);
    doorMesh.setMatrixAt(i, doorMatrix(d, Number($('#height').value))); doorMesh.instanceMatrix.needsUpdate = true;
    moving = true;

  if (choice === 'auto' && level !== 'low' && map && document.hasFocus() && now - builtAt > 2500 && gap < 1000) { // background windows are throttled, not slow
    slow = Math.max(0, slow + (gap > 100 ? 8 : gap > 36 ? 1 : -1)); // a crawling machine steps down within seconds
    if (slow > 45) { slow = 0; setLevel(level === 'high' ? 'medium' : 'low'); return; }
  }

  const reach = camera.position.distanceTo(controls.target); // fog follows the zoom: near stays clear, far sinks into murk
  scene.fog.near = reach; scene.fog.far = reach * 2.8;

    statsAt = now;

function setLevel(next) {
  level = next; Q = PRESETS[level]; statsAt = -Infinity; // low draws once then idles, so the label must update on that frame
  makeRenderer();
  U.uLM.value?.dispose(); U.uLM.value = null;
  build();
}

/* ---------------- loading ---------------- */
const say = (text) => { $('#msg').textContent = text; $('#empty').hidden = false; };
let loading = 0;
async function load(read, name) {
  const ticket = ++loading;
  say(`Loading ${name}…`);
  try {
    const json = JSON.parse(await read()), next = parseMap(json);
    let image = null;
    if (typeof json.image === 'string' && json.image) {
      const b64 = json.image, mime = b64.startsWith('UklGR') ? 'image/webp' : b64.startsWith('/9j/') ? 'image/jpeg' : 'image/png';
      image = await createImageBitmap(await (await fetch(b64.startsWith('data:') ? b64 : `data:${mime};base64,${b64}`)).blob());
    }
    if (ticket !== loading) return image?.close(); // a newer map was opened while this one decoded
    picture?.close(); picture = image; map = next;
    U.uLM.value?.dispose(); U.uLM.value = null;
    build(); frame();
    $('#empty').hidden = true; $('#stats').hidden = false; document.title = `${name} · Geez 3D Table`; statsAt = -Infinity;
  } catch (err) {

  }
}
const openFile = (file) => file && load(() => file.text(), file.name);

/* ---------------- wiring ---------------- */
document.querySelectorAll('[data-open]').forEach((b) => b.addEventListener('click', () => $('#file').click()));
$('#file').addEventListener('change', (e) => { openFile(e.target.files[0]); e.target.value = ''; });
addEventListener('dragover', (e) => { e.preventDefault(); document.body.classList.add('drag'); });
addEventListener('dragleave', (e) => { if (!e.relatedTarget) document.body.classList.remove('drag'); });
addEventListener('drop', (e) => { e.preventDefault(); document.body.classList.remove('drag'); openFile(e.dataTransfer.files[0]); });
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); dirty = true; });

for (const id of ['time', 'height', 'fixtures', 'grid']) {
  const el = $('#' + id), saved = params.get(id) ?? store.get(id), box = el.type === 'checkbox';
  if (saved !== null) { if (box) el.checked = saved === 'true'; else el.value = saved; }
  el.addEventListener('input', () => {
    store.set(id, box ? el.checked : el.value);
    if (id === 'time') applyTime();
    else if (id === 'grid') { const g = world.getObjectByName('grid'); if (g) g.visible = el.checked; dirty = true; }
    else build();
  });
}
$('#quality').value = choice;
$('#quality').addEventListener('change', (e) => { choice = e.target.value; store.set('quality', choice); statsAt = -Infinity; setLevel(choice === 'auto' ? guessQuality() : choice); });
$('#top').addEventListener('click', () => map && frame(true));
if (innerWidth < 600) $('#menu').open = false;

try {
  makeRenderer(); applyTime();
  window.tableReady = true;
  const url = params.get('map');
  if (url) load(async () => { const r = await fetch(url); if (!r.ok) throw Error(`HTTP ${r.status}`); return r.text(); }, url.split('/').pop());
} catch (err) {
  console.error(err); window.tableReady = true; say('This browser could not start 3D graphics (WebGL 2).');
}

/* ---------------- self-check: open with ?test ---------------- */
if (params.has('test')) {
  const m = parseMap({ resolution: { map_origin: { x: 1, y: 1 }, map_size: { x: 10, y: 8 } }, line_of_sight: [[{ x: 3, y: 1 }, { x: 3, y: 9 }, { x: 3, y: 9 }]],
    portals: [{ bounds: [{ x: 2, y: 2 }, { x: 2, y: 3 }], closed: true }, { bounds: [{ x: 4, y: 2 }, { x: 4, y: 3 }], closed: false }, {}], lights: [{ position: { x: 2, y: 5 }, range: 5, color: 'ff112233' }, { range: 2 }] });
  const checks = {
    'walls shift by origin, zero-length dropped': JSON.stringify(m.walls) === '[[2,0,2,8]]',
    'closed portal is a door, open is a window': m.doors.length === 2 && !m.doors[0].window && m.doors[1].window,
    'ARGB colour, bad light dropped': m.lights.length === 1 && m.lights[0].color === '#112233',
    'walls block light': Math.abs(visibility(1, 4, 5, m.walls, 4)[0][0] - 2) < 1e-6,
    'bad file rejected': (() => { try { parseMap({}); return false; } catch { return true; } })()
  };
  const failed = Object.keys(checks).filter((k) => !checks[k]);
  console.log(failed.length ? `SELF-TEST FAILED: ${failed.join('; ')}` : `SELF-TEST PASSED (${Object.keys(checks).length})`);
}
