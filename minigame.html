<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Geez Minigame</title>
<link rel="icon" href="data:,">
<style>
  body { margin: 0; background: #14121a; color: #eee; font: 15px monospace; display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; padding: 12px 16px; }
  main { width: min(960px, 100%); text-align: center; }
  canvas { width: 100%; image-rendering: pixelated; border: 3px solid #4a4560; background: #26303a; }
  button, select { font: inherit; background: #332e45; color: #fff; border: 2px solid #6b6390; padding: 4px 10px; cursor: pointer; }
  #word { font-size: 30px; letter-spacing: 3px; min-height: 40px; color: #aaa; }
  #word b { color: #7dff8a; }
  #gauge { position: relative; height: 22px; margin: 6px auto; width: 70%; background: #3a2730; border: 2px solid #888; visibility: hidden; }
  #gauge i, #gauge u { position: absolute; top: 0; bottom: 0; }
  #gauge i { background: #2fbf4a; }
  #gauge u { width: 5px; margin-left: -2px; background: #fff; }
  #side { width: 290px; text-align: left; }
  #side label { display: flex; justify-content: space-between; gap: 8px; margin: 4px 0; }
  #list { max-height: 70vh; overflow: auto; }
  #pick button { margin: 6px; font-size: 18px; }
  [hidden] { display: none !important; }
</style>
<script src="js/firebase-config.js"></script>
</head>
<body>
<main>
  <div id="status" role="status">Connecting…</div>
  <div id="pick" hidden></div>
  <canvas id="c" width="640" height="400" aria-label="Minigame arena"></canvas>
  <div id="gauge" aria-label="Skill gauge"><i></i><u></u></div>
  <div id="word"></div>
  <div id="help"></div>
</main>
<aside id="side" hidden>
  <button id="run" type="button">Start</button>
  <button id="reset" type="button">Reset fight</button>
  <button id="clear" type="button">Clear</button>
  <p>Bring tokens in from the table:</p>
  <div id="list"></div>
</aside>
<script type="module">
import { watch, put, patch } from "./js/store.js";

const GM = new URLSearchParams(location.search).get("gm") === "jonny";   // a link, not a password
const W = 640, H = 400, SPEED = 140, HERO_HP = 100;
const $ = (id) => document.getElementById(id), ctx = $("c").getContext("2d");
const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const CLASSES = {
  fighter: { attack: "Sword slash", support: "Hold the Line", words: "slash cleave strike parry charge riposte steel valor smite rally" },
  ranger: { attack: "Arrow shot", support: "Shadow Cloak", words: "arrow quiver volley hunter thorn falcon snare timber pierce stalk" },
  cleric: { attack: "Sacred Flame", support: "Healing Word", words: "flame sacred radiant halo prayer divine blaze mercy dawn censer" },
  bard: { attack: "Cutting Words", support: "Hold Person", words: "clumsy buffoon dimwit oaf nitwit smelly coward dunce windbag turnip" }
};
let heroes = {}, foes = {}, pos = {}, running = false, tokens = {};
const shown = {}, effects = [], held = new Set();
let me = null, my = null;   // my id, my local position

/* ---------- shared state ---------- */
watch("minigame/heroes", (v) => { heroes = v || {}; drawPick(); drawList(); });
watch("minigame/foes", (v) => { foes = v || {}; drawList(); });
watch("minigame/pos", (v) => { pos = v || {}; if (!me) drawPick(); });
watch("minigame/respawn", (v) => { if (me && v?.at?.[me]) { my = { ...v.at[me] }; charge = line = null; } });
watch("minigame/running", (v) => { running = !!v; $("run").textContent = running ? "Pause" : "Start"; });
let seenFx = null;
watch("minigame/fx", (v) => {
  const first = !seenFx; seenFx ||= new Set();
  for (const f of Object.values(v || {})) if (!seenFx.has(f.n)) { seenFx.add(f.n); if (!first) effects.push({ ...f, at: performance.now() }); }
});

/* ---------- player: choose, move, type, gauge ---------- */
let picked = null;
function drawPick() {
  if (GM) return;
  if (me && !heroes[me]) { me = my = null; }
  const saved = sessionStorage.getItem("mini-me");
  if (!me && saved && heroes[saved] && pos[saved]) join(saved);
  $("pick").hidden = !!me;
  const sig = JSON.stringify(Object.entries(heroes).map(([id, h]) => [id, h.name, h.cls]));
  if (sig === picked) return; picked = sig;
  $("pick").replaceChildren(Object.keys(heroes).length ? "Who are you?" : "Waiting for the GM to bring characters in…", document.createElement("br"),
    ...Object.entries(heroes).map(([id, h]) => { const b = document.createElement("button"); b.type = "button"; b.textContent = `${h.name} (${h.cls})`; b.onclick = () => { b.blur(); join(id); }; return b; }));
}
function join(id) {
  me = id; sessionStorage.setItem("mini-me", id); my = { x: 80, y: 200, face: 1, ...pos[id] };
  word = ""; typed = ""; charge = line = null; $("pick").hidden = true;
}
let word = "", typed = "", charge = null, line = null, cooldown = 0, note = "", noteUntil = 0;
const say = (text) => { note = text; noteUntil = performance.now() + 1500; };
const act = (k, to) => put(`minigame/acts/${me}_${Date.now()}`, { by: me, k, to: to || null });
const sendPos = () => put(`minigame/pos/${me}`, { x: Math.round(my.x), y: Math.round(my.y), face: my.face });
const nearest = (list, from) => list.sort((a, b) => dist(a[1], from) - dist(b[1], from))[0];
const liveFoes = () => Object.entries(foes).filter(([, f]) => f.hp > 0);
const allies = () => Object.entries(heroes).filter(([id, h]) => id !== me && h.hp > 0 && pos[id]).map(([id]) => [id, pos[id]]);
function newWord() { const all = CLASSES[heroes[me].cls].words.split(" ").filter((w) => w !== word); word = all[Math.random() * all.length | 0]; typed = ""; }
function teleport(target, gap) {
  effects.push({ type: "blink", x: my.x, y: my.y, at: performance.now() });
  const side = my.x < target.x ? -1 : 1;
  my.x = clamp(target.x + side * gap, 16, W - 16); my.y = clamp(target.y, 24, H - 16); my.face = -side; sendPos();
}
const gapTo = (f) => 18 + 18 * clamp(f.size, 0.75, 2.5);
function attack() {
  const foe = nearest(liveFoes(), my); if (!foe) return;
  if (heroes[me].cls === "fighter") teleport(foe[1], gapTo(foe[1])); else { my.face = foe[1].x < my.x ? -1 : 1; sendPos(); }
  act("attack", foe[0]);
}
function support() {
  const cls = heroes[me].cls;
  if (cls === "fighter") { line = { left: 4, t: 0 }; act("line"); return; }
  if (cls === "ranger") { const ally = nearest(allies(), my); if (ally) teleport(ally[1], 24); act("cloak", ally?.[0]); }
  if (cls === "cleric") act("heal");
  if (cls === "bard") act("hold", nearest(liveFoes(), my)?.[0]);
}
const zone = () => (line ? [0.38, 0.62] : [0.65, 0.85]);
const tri = (t) => 1 - Math.abs((t % 2) - 1);   // 0 → 1 → 0
const marker = () => tri((line || charge).t * (line ? 1.3 : 1.1));
const canAct = () => me && heroes[me]?.hp > 0 && running;
addEventListener("keydown", (e) => {
  if (GM || !me || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key.startsWith("Arrow")) { e.preventDefault(); held.add(e.key); return; }
  if (e.code === "Space") {
    e.preventDefault(); if (e.repeat || !canAct()) return;
    if (line) {
      const [a, b] = zone(), m = marker();
      if (m >= a && m <= b) { line.left = 4; act("line"); say("Holding!"); } else { line = null; cooldown = 3; act("lineEnd"); say("The line broke!"); }
    } else if (cooldown <= 0) charge = { t: 0 };
    return;
  }
  if (!canAct() || line || !/^[a-z]$/i.test(e.key)) return;
  if (!word) newWord();
  if (e.key.toLowerCase() === word[typed.length]) typed += word[typed.length]; else typed = "";
  if (typed === word) { attack(); newWord(); }
});
addEventListener("keyup", (e) => {
  held.delete(e.key);
  if (e.code !== "Space") return;
  e.preventDefault(); if (!charge) return;
  const [a, b] = zone(), m = marker(); charge = null; if (!canAct()) return;
  if (m >= a && m <= b) { cooldown = heroes[me].cls === "fighter" ? 1 : 6; support(); say(CLASSES[heroes[me].cls].support + "!"); } else { cooldown = 2; say("Missed the green"); }
});
addEventListener("blur", () => { held.clear(); charge = null; });
let sent = 0, dirty = false;
function playerStep(dt) {
  const h = heroes[me]; if (!h) return;
  if (!word) newWord();
  cooldown -= dt;
  if (charge) charge.t += dt;
  if (line) { line.t += dt; line.left -= dt; if (line.left <= 0 || h.hp <= 0 || !running) { line = null; cooldown = 3; } }
  if (h.hp > 0 && !line) {
    const dx = held.has("ArrowRight") - held.has("ArrowLeft"), dy = held.has("ArrowDown") - held.has("ArrowUp");
    if (dx || dy) {
      const n = Math.hypot(dx, dy);
      my.x = clamp(my.x + dx / n * SPEED * dt, 16, W - 16); my.y = clamp(my.y + dy / n * SPEED * dt, 24, H - 16);
      if (dx) my.face = dx; dirty = true;
    }
  }
  if (dirty && performance.now() - sent > 80) { sent = performance.now(); dirty = false; sendPos(); }
}

/* ---------- GM: pick tokens, run the fight ---------- */
const queue = new Map();
if (GM) {
  $("side").hidden = false;
  watch("tokens", (v) => { tokens = v || {}; drawList(); });
  watch("minigame/acts", (v) => { for (const [k, a] of Object.entries(v || {})) queue.set(k, a); });
  $("run").onclick = (e) => { e.target.blur(); put("minigame/running", !running || null); };
  $("clear").onclick = () => put("minigame", null);
  $("reset").onclick = () => {
    const c = { "minigame/running": null, "minigame/respawn": { n: Date.now(), at: Object.fromEntries(Object.keys(heroes).map((id, i) => [id, spawn(false, i)])) } };
    Object.keys(heroes).forEach((id, i) => { Object.assign(c, { [`minigame/heroes/${id}/hp`]: HERO_HP, [`minigame/heroes/${id}/cloak`]: 0, [`minigame/heroes/${id}/line`]: 0, [`minigame/pos/${id}`]: spawn(false, i) }); });
    Object.entries(foes).forEach(([id, f], i) => { Object.assign(c, { [`minigame/foes/${id}/hp`]: f.max, [`minigame/foes/${id}/hold`]: 0, [`minigame/foes/${id}/x`]: spawn(true, i).x, [`minigame/foes/${id}/y`]: spawn(true, i).y }); });
    patch(c);
  };
  // a worker's timer keeps ticking when the GM looks at another tab
  const clock = new Worker(URL.createObjectURL(new Blob(["setInterval(() => postMessage(0), 100)"], { type: "text/javascript" })));
  let then = performance.now();
  clock.onmessage = () => { const now = performance.now(); gmStep(Math.min(0.5, (now - then) / 1000)); then = now; };
}
function spawn(foe, i) { return { x: (foe ? 540 : 80) + (Math.floor(i / 6) * (foe ? -50 : 50)), y: 60 + (i % 6) * 58, face: foe ? -1 : 1 }; }
function drawList() {
  if (!GM || $("list").contains(document.activeElement)) return;
  $("list").replaceChildren(...Object.entries(tokens).sort((a, b) => String(a[1].label).localeCompare(String(b[1].label))).map(([id, t]) => {
    const row = document.createElement("label"), pick = document.createElement("select");
    for (const [value, text] of [["", "—"], ...Object.keys(CLASSES).map((c) => [c, "Hero: " + c]), ["foe", "Hostile"]]) pick.add(new Option(text, value));
    pick.value = heroes[id]?.cls || (foes[id] ? "foe" : "");
    pick.onchange = () => { bring(id, t, pick.value); pick.blur(); drawList(); };
    row.append(t.label || id, pick); return row;
  }));
}
function bring(id, t, as) {
  const c = { [`minigame/heroes/${id}`]: null, [`minigame/foes/${id}`]: null, [`minigame/pos/${id}`]: null };
  const name = t.label || "Creature", img = t.img || null;
  if (as === "foe") {
    const max = clamp(Number(t.max || t.hp) || 60, 40, 400);
    c[`minigame/foes/${id}`] = { name, img, size: Number(t.size) || 1, hp: max, max, hold: 0, ...spawn(true, Object.keys(foes).length) };
  } else if (as) {
    const m = t.mini || {};
    c[`minigame/heroes/${id}`] = { name, cls: as, hp: HERO_HP, cloak: 0, line: 0, skin: m.skin || "#f1c7a5", hair: m.hairC || "#5a3a22", top: m.top || { fighter: "#7a7f8c", ranger: "#3f6b3a", cleric: "#d8d0b4", bard: "#7a2f5a" }[as], bot: m.bot || "#4a4030", trim: m.trim || "#f2c94c" };
    c[`minigame/pos/${id}`] = spawn(false, Object.keys(heroes).length);
  }
  patch(c);
}
const hitAt = new Map();
let fxN = 0;
function gmStep(dt) {
  const c = {}, h = structuredClone(heroes), f = structuredClone(foes);
  const fx = (type, a, b) => { const n = `${Date.now()}_${fxN}`; c[`minigame/fx/${fxN++ % 24}`] = { n, type, x: a.x, y: a.y, tx: b?.x ?? a.x, ty: b?.y ?? a.y }; };
  const hurt = (id, n) => { f[id].hp = Math.max(0, f[id].hp - n); };
  for (const [key, a] of queue) {
    c[`minigame/acts/${key}`] = null;
    const who = h[a.by], at = pos[a.by]; if (!running || !who || !at || who.hp <= 0) continue;
    const foe = f[a.to];
    if (a.k === "attack" && foe?.hp > 0) { hurt(a.to, who.cls === "fighter" ? 24 : 18); who.cloak = 0; fx(who.cls, at, foe); }
    if (a.k === "line" && who.cls === "fighter") { who.line = 4.3; fx("shield", at); }   // a little slack for lag
    if (a.k === "lineEnd") who.line = 0;
    if (a.k === "cloak") for (const id of [a.by, a.to]) if (h[id]) { h[id].cloak = 6; fx("cloak", pos[id] || at); }
    if (a.k === "heal") {
      const [id, hero] = Object.entries(h).sort((x, y) => x[1].hp - y[1].hp)[0];
      hero.hp = Math.min(HERO_HP, hero.hp + 45); fx("heal", pos[id] || at);
    }
    if (a.k === "hold" && foe?.hp > 0) { foe.hold = 6; fx("hold", foe); }
  }
  queue.clear();
  if (running) {
    for (const hero of Object.values(h)) for (const k of ["cloak", "line"]) hero[k] = Math.max(0, +(hero[k] - dt).toFixed(2) || 0);
    for (const [id, foe] of Object.entries(f)) {
      if (foe.hp <= 0) continue;
      if (foe.hold > 0) { foe.hold = Math.max(0, +(foe.hold - dt).toFixed(2)); continue; }
      const up = Object.entries(h).filter(([k, v]) => v.hp > 0 && pos[k]);
      const tanks = up.filter(([, v]) => v.line > 0);
      const target = nearest((tanks.length ? tanks : up.filter(([, v]) => !(v.cloak > 0))).map(([k]) => [k, pos[k]]), foe);
      if (!target) continue;
      const [tid, p] = target, d = dist(foe, p), reach = gapTo(foe) + 2;
      if (d > reach) {
        let dx = (p.x - foe.x) / d, dy = (p.y - foe.y) / d;
        for (const [oid, o] of Object.entries(f)) { const gap = dist(foe, o); if (oid !== id && o.hp > 0 && gap > 0 && gap < 26) { dx += (foe.x - o.x) / gap * 0.7; dy += (foe.y - o.y) / gap * 0.7; } }
        foe.x = +clamp(foe.x + dx * 48 * dt, 16, W - 16).toFixed(1); foe.y = +clamp(foe.y + dy * 48 * dt, 24, H - 16).toFixed(1);
      } else if (!(hitAt.get(id) > Date.now())) {
        hitAt.set(id, Date.now() + 1400); h[tid].hp = Math.max(0, h[tid].hp - (h[tid].line > 0 ? 2 : 8)); fx("bite", p);
      }
    }
  }
  for (const [group, next, was] of [["heroes", h, heroes], ["foes", f, foes]]) for (const [id, o] of Object.entries(next)) for (const [k, v] of Object.entries(o)) if (v !== was[id][k]) c[`minigame/${group}/${id}/${k}`] = v;
  if (Object.keys(c).length) patch(c);
}

/* ---------- drawing ---------- */
// 12x14 pixel person: h hair, s skin, e eyes, t top, r trim, b legs
const BODY = ["....hhhh....", "...hhhhhh...", "...hsssse...", "...hsesse...", "....ssss....", "..ttttttt...", ".sttttttts..", ".sttrrrtts..", "..ttttttt...", "..rrrrrrr..."];
const LEGS = [["...bb.bb....", "...bb.bb....", "..bbb.bbb..."], ["..bb...bb...", ".bb.....bb..", ".bb.....bb.."]];
const px = (x, y, w, h, color) => { ctx.fillStyle = color; ctx.fillRect(Math.round(x), Math.round(y), w, h); };
function hero(h, x, y, face, step) {
  const colors = { h: h.hair, s: h.skin, e: "#222", t: h.top, r: h.trim, b: h.bot };
  ctx.save(); ctx.translate(Math.round(x), Math.round(y)); ctx.scale(face < 0 ? -1 : 1, 1);
  if (h.hp <= 0) ctx.rotate(Math.PI / 2);
  [...BODY, ...LEGS[step]].forEach((row, j) => [...row].forEach((ch, i) => { if (ch !== ".") px((i - 6) * 3, (j - 9) * 3, 3, 3, colors[ch] || h.skin); }));
  if (h.cls === "fighter") { px(14, -21, 3, 21, "#dfe6ee"); px(11, -3, 9, 3, "#8a6a30"); if (!(h.line > 0)) { px(-18, -9, 9, 15, "#8a94a8"); px(-15, -6, 3, 9, h.trim); } }
  if (h.cls === "ranger") { for (const [i, j] of [[0, -15], [1, -12], [2, -9], [2, -6], [2, -3], [1, 0], [0, 3]]) px(12 + i * 3, j, 3, 3, "#a8743a"); px(12, -12, 1, 15, "#eee"); }
  if (h.cls === "cleric") { px(14, -9, 3, 18, "#8a6a30"); px(11, -15, 9, 9, "#c9ced6"); px(-9, -33, 18, 3, "#ffe27a"); }
  if (h.cls === "bard") { px(8, -3, 12, 12, "#b8763a"); px(11, 0, 6, 6, "#5a3416"); px(17, -15, 3, 12, "#8a5a2a"); px(-6, -33, 15, 6, h.trim); px(6, -39, 3, 6, "#e84a5f"); }
  ctx.restore();
}
const sprites = new Map();   // token pictures shrunk small, so they scale back up as pixels
function sprite(src) {
  if (!src) return null;
  if (!sprites.has(src)) {
    const img = new Image(), small = document.createElement("canvas"); small.width = small.height = 24; sprites.set(src, null);
    img.onload = () => { small.getContext("2d").drawImage(img, 0, 0, 24, 24); sprites.set(src, small); }; img.src = src;
  }
  return sprites.get(src);
}
const label = (text, x, y, color = "#fff") => { ctx.font = "10px monospace"; ctx.textAlign = "center"; ctx.fillStyle = "#000"; ctx.fillText(text, x + 1, y + 1); ctx.fillStyle = color; ctx.fillText(text, x, y); };
const bar = (x, y, part, color) => { px(x - 18, y, 36, 5, "#000"); px(x - 17, y + 1, Math.round(34 * clamp(part, 0, 1)), 3, color); };
function ease(id, p, dt) {   // glide towards the synced position; a big jump is a teleport
  const s = shown[id];
  if (!s || dist(s, p) > 80) return (shown[id] = { x: p.x, y: p.y, moving: false });
  const k = Math.min(1, dt * 14); s.moving = dist(s, p) > 1; s.x += (p.x - s.x) * k; s.y += (p.y - s.y) * k; return s;
}
function ring(x, y, r, color) { ctx.strokeStyle = color; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.stroke(); }
function drawEffect(f, k) {
  const x = f.x + (f.tx - f.x) * k, y = f.y + (f.ty - f.y) * k;
  if (f.type === "fighter") for (let i = -6; i <= 6; i++) px(f.tx + i * 3, f.ty + i * 3 * (k < 0.5 ? 1 : -1) - 8, 4, 4, "#fff");
  if (f.type === "ranger") for (const o of [-8, 0, 8]) { px(x - 6, y + o * (1 - k) - 6, 12, 2, "#d9b070"); px(x + (f.tx > f.x ? 6 : -9), y + o * (1 - k) - 7, 4, 4, "#fff"); }
  if (f.type === "cleric") for (let i = 0; i < 14; i++) px(f.tx + Math.sin(i * 7 + k * 9) * 10, f.ty - i * 4 * k - 4, 5, 5, i % 2 ? "#ffd94a" : "#fff3b0");
  if (f.type === "bard") { label("#@!*", x, y - 10 - Math.sin(k * 9) * 6, "#ff7ad9"); label("♪ ♫", x - 14, y, "#c9a0ff"); }
  if (f.type === "shield") ring(f.x, f.y, 10 + k * 60, "#8fc8ff");
  if (f.type === "heal") for (let i = 0; i < 6; i++) label("+", f.x + (i - 3) * 8, f.y - k * 40 - (i % 3) * 6, "#7dff8a");
  if (f.type === "cloak" || f.type === "blink") ring(f.x, f.y - 6, 26 * (1 - k), "#9a6bff");
  if (f.type === "hold") ring(f.x, f.y, 40 - k * 20, "#ff7ad9");
  if (f.type === "bite") label("✖", f.x, f.y - 10 - k * 12, "#ff5050");
}
let then = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - then) / 1000); then = now;
  if (me) playerStep(dt);
  for (let y = 0; y < H; y += 32) for (let x = 0; x < W; x += 32) px(x, y, 32, 32, (x + y) % 64 ? "#2c3a33" : "#31413a");
  const things = [
    ...Object.entries(foes).filter(([, f]) => f.hp > 0).map(([id, f]) => ({ id, y: f.y, foe: f })),
    ...Object.entries(heroes).filter(([id]) => pos[id]).map(([id, h]) => ({ id, y: id === me ? my.y : pos[id].y, hero: h }))
  ].sort((a, b) => a.y - b.y);
  for (const { id, foe, hero: h } of things) {
    const p = id === me ? my : ease(id, foe || pos[id], dt);
    if (foe) {
      const size = Math.round(36 * clamp(foe.size, 0.75, 2.5)), img = sprite(foe.img), bob = foe.hold > 0 ? 0 : Math.sin(now / 150 + p.x) * 1.5;
      ctx.imageSmoothingEnabled = false;
      if (img) ctx.drawImage(img, Math.round(p.x - size / 2), Math.round(p.y - size / 2 + bob), size, size); else px(p.x - 12, p.y - 12, 24, 24, "#a94c3d");
      if (foe.hold > 0) { ring(p.x, p.y, size / 2 + 4, "#ff7ad9"); label("HELD", p.x, p.y - size / 2 - 12, "#ff7ad9"); }
      bar(p.x, p.y - size / 2 - 8, foe.hp / foe.max, "#ff5050"); label(foe.name, p.x, p.y + size / 2 + 10, "#ffb0a0");
    } else {
      const moving = id === me ? !line && [...held].length > 0 : p.moving;
      ctx.globalAlpha = h.cloak > 0 ? 0.35 : 1;
      hero(h, p.x, p.y, id === me ? my.face : pos[id].face, moving ? (now / 140 | 0) % 2 : 0);
      ctx.globalAlpha = 1;
      if (h.line > 0) { px(p.x + (pos[id].face < 0 ? -26 : 14), p.y - 16, 12, 32, "#aab6cc"); px(p.x + (pos[id].face < 0 ? -22 : 18), p.y - 10, 4, 20, h.trim); ring(p.x, p.y, 30, "#8fc8ff"); }
      bar(p.x, p.y - 46, h.hp / HERO_HP, "#5be36a"); label(h.hp > 0 ? h.name : h.name + " (down)", p.x, p.y + 24, id === me ? "#ffe27a" : "#fff");
    }
  }
  for (let i = effects.length - 1; i >= 0; i--) { const k = (now - effects[i].at) / 500; if (k > 1) effects.splice(i, 1); else drawEffect(effects[i], Math.max(0, k)); }
  const hs = Object.values(heroes), fs = Object.values(foes);
  const over = fs.length && fs.every((f) => f.hp <= 0) ? "VICTORY!" : hs.length && hs.every((h) => h.hp <= 0) ? "The party has fallen" : "";
  if (over) { px(0, 170, W, 56, "#000a"); ctx.font = "32px monospace"; ctx.textAlign = "center"; ctx.fillStyle = "#ffe27a"; ctx.fillText(over, W / 2, 209); }
  const mine = me && heroes[me], info = mine && CLASSES[mine.cls];
  $("status").textContent = (GM ? "GM · " : mine ? `${mine.name} · ` : "") + (running ? "Fight!" : "Waiting for the GM to start") + (now < noteUntil ? ` · ${note}` : "");
  $("help").textContent = !mine ? "" : mine.hp <= 0 ? "You are down. A Healing Word can bring you back." : line ? "HOLD THE LINE: tap SPACE each time the marker is in the green" :
    `Arrows: move · Type the word: ${info.attack} · Hold SPACE, release in the green: ${info.support}${cooldown > 0 ? ` (ready in ${Math.ceil(cooldown)}s)` : ""}`;
  const html = mine && word && !line && mine.hp > 0 ? `<b>${typed}</b>${word.slice(typed.length)}` : "";
  if ($("word").innerHTML !== html) $("word").innerHTML = html;   // only our own word list, never database text
  const g = charge || line; $("gauge").style.visibility = g ? "visible" : "hidden";
  if (g) { const [a, b] = zone(), [green, mark] = $("gauge").children; green.style.left = a * 100 + "%"; green.style.width = (b - a) * 100 + "%"; mark.style.left = marker() * 100 + "%"; }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
